server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;

  location = /downloads/release.json {
    add_header Cache-Control "no-store";
    default_type application/json;
    try_files $uri =404;
  }
  location /downloads/ {
    add_header Content-Disposition "attachment";
    try_files $uri =404;
  }
  location /assets/ {
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
